name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: Engine2RB
  APP_ID: engine2rb.converter
  # pin the Fyne packaging tool; check https://github.com/fyne-io/tools for newer releases
  FYNE_TOOLS_VERSION: v1.7.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Resolve modules
        run: go mod tidy
      - name: Test app
        run: go test ./...
      - name: Test djtools fork
        working-directory: third_party/djtools
        run: go test ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cgo (SQLite driver and Fyne) needs a C compiler. The hosted Windows
      # image has usually included MinGW gcc; install it only if missing.
      - name: Ensure gcc
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y }
          gcc --version
      - name: Resolve modules
        run: go mod tidy
      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOLS_VERSION }}
      - name: Package
        shell: pwsh
        run: |
          fyne package --target windows --src cmd/engine2rb --name $env:APP_NAME --app-id $env:APP_ID --icon Icon.png --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse -Filter *.exe -Path cmd/engine2rb | Copy-Item -Destination dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Engine2RB-windows-amd64
          path: dist/*.exe

  macos:
    needs: test
    runs-on: macos-latest # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve modules
        run: go mod tidy
      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOLS_VERSION }}
      - name: Build arm64
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o dist/engine2rb-arm64 ./cmd/engine2rb
      # Intel build is best effort: cross-compiling cgo for amd64 on an arm64
      # runner is untested here. If it fails, the app ships arm64-only.
      - name: Build amd64 (best effort)
        id: amd64
        continue-on-error: true
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o dist/engine2rb-amd64 ./cmd/engine2rb
      - name: Merge into universal binary
        run: |
          if [ -f dist/engine2rb-amd64 ]; then
            lipo -create -output dist/engine2rb dist/engine2rb-arm64 dist/engine2rb-amd64
            echo "ARCH=universal" >> "$GITHUB_ENV"
          else
            cp dist/engine2rb-arm64 dist/engine2rb
            echo "ARCH=arm64" >> "$GITHUB_ENV"
          fi
          lipo -info dist/engine2rb
      - name: Package .app
        run: |
          fyne package --target darwin --executable dist/engine2rb --name "$APP_NAME" --app-id "$APP_ID" --icon cmd/engine2rb/Icon.png --release
          APP=$(find . -maxdepth 3 -name "$APP_NAME.app" -type d | head -1)
          echo "Found $APP"
          ditto -c -k --keepParent "$APP" "dist/$APP_NAME-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Engine2RB-macos
          path: dist/*.zip
